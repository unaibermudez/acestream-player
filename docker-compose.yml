name: acestream-player

services:
  # Motor de Acestream con su API HTTP (puerto 6878). No se publica fuera de la red de Docker:
  # solo se accede a él a través del nginx del servicio "web".
  acestream:
    image: ghcr.io/martinbjeldbak/acestream-http-proxy:latest
    restart: unless-stopped
    environment:
      # Añade --bind-all: sin él el motor solo escucha en el loopback de su contenedor y nginx
      # no podría alcanzarlo. Como no hay "ports:", sigue sin ser accesible desde fuera de Docker.
      ALLOW_REMOTE_ACCESS: 'yes'
    expose:
      - '6878'
    healthcheck:
      # La imagen no incluye wget ni curl, pero sí python3.
      test:
        [
          'CMD',
          'python3',
          '-c',
          'import urllib.request; urllib.request.urlopen("http://127.0.0.1:6878/webui/api/service?method=get_version&format=json", timeout=4)',
        ]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  # SPA servida por nginx, que además hace de proxy inverso de /ace/ hacia el motor.
  web:
    build: .
    restart: unless-stopped
    depends_on:
      - acestream
    ports:
      # Único puerto expuesto. Cambia el número de la izquierda (o define WEB_PORT en .env).
      - '${WEB_PORT:-8080}:80'
    volumes:
      # Carpeta (no archivo suelto) con el catálogo: data/catalog.json se sirve en /data/catalog.json.
      # Se puede sustituir el archivo en caliente; no hace falta reiniciar ni reconstruir.
      - ./data:/usr/share/nginx/html/data:ro
