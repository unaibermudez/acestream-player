<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Acestream Player</title>
    <meta
      name="description"
      content="Organiza y reproduce tus links de Acestream contra tu motor casero."
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#F5F2EA" />
    <script>
      // Aplica el tema guardado antes del primer pintado (sin destello). Ver src/hooks/useTheme.ts.
      try {
        var t = localStorage.getItem('acestream-player:theme')
        var dark =
          t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
        document.querySelector('meta[name=theme-color]').content = dark ? '#181611' : '#F5F2EA'
      } catch (e) {}
    </script>
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Acestream" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
